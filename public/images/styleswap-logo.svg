<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#ssGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="42" height="42" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Modern Dual Arrows / Wardrobe Swap "S" Loop -->
  <!-- Upper Loop (Emerald to Amber) -->
  <path d="M 15 19 C 15 14.5, 18.5 12, 24 12 C 29.5 12, 33 14.5, 33 18 C 33 21, 30.5 22.5, 26 23.5 L 22 24.5 C 17.5 25.5, 15 27, 15 30 C 15 33.5, 18.5 36, 24 36 C 29.5 36, 33 33.5, 33 29" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Swap Arrow Head Top (Rightward) -->
  <path d="M 29 10 L 34 14.5 L 29 19" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Swap Arrow Head Bottom (Leftward) -->
  <path d="M 19 38 L 14 33.5 L 19 29" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Center Accent Spark -->
  <circle cx="24" cy="24" r="1.8" fill="#FDE047"/>
</svg>
